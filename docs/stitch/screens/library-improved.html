<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Little Paradise - Library</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  :root {
    --bg: #090B12;
    --bg2: #111522;
    --glass: rgba(255,255,255,0.065);
    --border: rgba(255,255,255,0.13);
    --accent: #A78BFA;
    --accent2: #8BC5FF;
    --highlight: #C4B5FD;
    --text: #F8FAFC;
    --muted: #9299AB;
    --lp-glass-bg-subtle: rgba(255,255,255,0.04);
    --lp-glass-bg-raised: rgba(255,255,255,0.09);
    --lp-glass-bg-overlay: rgba(255,255,255,0.12);
    --lp-glass-border-subtle: rgba(255,255,255,0.08);
    --lp-glass-border-raised: rgba(255,255,255,0.16);
    --lp-glass-border-overlay: rgba(255,255,255,0.22);
    --lp-blur-sm: 12px;
    --lp-blur-md: 28px;
    --lp-blur-lg: 40px;
    --lp-radius-md: 12px;
    --lp-radius-lg: 20px;
    --lp-radius-xl: 28px;
    --lp-shadow-glass: inset 0 1px 0 rgba(255,255,255,0.08), 0 12px 40px rgba(0,0,0,0.18);
    --lp-shadow-raised: inset 0 1px 0 rgba(255,255,255,0.12), 0 20px 60px rgba(0,0,0,0.25);
    --lp-focus-ring: 0 0 0 2px #A78BFA, 0 0 0 4px rgba(167,139,250,0.35);
    --lp-btn-primary: #6A4AF0;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* Glass surfaces */
  .glass {
    background: rgba(255,255,255,0.065);
    backdrop-filter: blur(28px) saturate(160%);
    -webkit-backdrop-filter: blur(28px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 12px 40px rgba(0,0,0,0.18);
  }

  .glass-strong {
    background: rgba(255,255,255,0.09);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.16);
    box-shadow: var(--lp-shadow-raised);
    border-radius: var(--lp-radius-lg);
  }

  .glass-subtle {
    background: var(--lp-glass-bg-subtle);
    backdrop-filter: blur(12px) saturate(140%);
    border: 1px solid var(--lp-glass-border-subtle);
    box-shadow: var(--lp-shadow-glass);
    border-radius: var(--lp-radius-md);
  }

  /* Layout */
  .page {
    min-height: 100vh;
    padding: 1rem sm:p-6 lg:p-8;
    max-width: 1400px;
    margin: 0 auto;
  }

  .section-title {
    font-display text-xl font-bold mb-4;
  }

  /* Section tabs */
  .section-tabs {
    flex items-center justify-between mb-4;
  }

  /* Skeleton */
  .skeleton {
    background: linear-gradient(90deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.10) 50%, rgba(255,255,255,0.04) 100%);
    background-size: 200% 100%;
    animation: shimmer 1.6s infinite;
    border-radius: 12px;
  }

  @keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }

  .skeleton {
    animation: shimmer 1.6s infinite;
  }

  /* Track card */
  .track-card {
    flex items-center gap-3 p-2 rounded-lg hover:bg-white/10 transition-transform duration-150 ease-out-custom active:scale-95 cursor-pointer;
  }

  .track-artwork {
    relative shrink-0 w-10 h-10 rounded-lg bg-gradient-to-br flex items-center justify-center shadow-lg overflow-hidden;
  }

  .track-info {
    flex-1 min-w-0;
  }

  .track-title {
    text-sm font-medium truncate;
  }

  .track-artist {
    text-xs text-muted truncate;
  }

  /* Empty state */
  .empty-state {
    flex flex-col items-center justify-center py-20;
  }

  .empty-icon {
    w-40 h-40 rounded-xl bg-gradient-to-br from-violet-500 to-sky-500 flex items-center justify-center shadow-lg;
  }

  .empty-title {
    font-display text-xl font-bold mt-4;
  }

  .empty-desc {
    text-xs text-muted mt-1;
  }

  .empty-cta {
    mt-4 px-4 py-2 rounded-full bg-white text-black font-medium hover:bg-white/10 transition-transform duration-150 ease-out-custom active:scale-95;
  }
</style>
</head>
<body class="p-4 sm:p-6 lg:p-8 space-y-8">
  <h1 class="font-display text-3xl font-bold">Your Library</h1>

  <!-- Sections tabs -->
  <div class="flex items-center justify-between mb-4">
    <section class="space-y-8">
      <!-- Recently Played -->
      <section>
        <h2 class="font-display text-xl font-bold mb-4">Recently Played</h2>
        <div class="space-y-1">
          <!-- Recently played tracks -->
          <div class="flex items-center gap-3 p-2 rounded-lg bg-white/10 hover:bg-white/5 cursor-pointer transition-transform duration-150 ease-out-custom active:scale-95">
            <div class="relative shrink-0 w-10 h-10 rounded-lg bg-gradient-to-br from-violet-500 to-sky-500 flex items-center justify-center shadow-lg">
              <Artwork seed={t.artworkSeed} size={40} />
            </div>
            <div class="flex-1 min-w-0">
              <div class="text-sm font-medium truncate">{t.title}</div>
              <div class="text-xs text-muted truncate">{t.artist}</div>
            </div>
          </button>
        </div>
      </section>

      <!-- Liked Songs -->
      <section>
        <h2 class="font-display text-xl font-bold mb-4">Liked Songs</h2>
        <div class="space-y-1">
          <div class="flex items-center gap-3 p-2 rounded-lg bg-white/10 hover:bg-white/5 cursor-pointer transition-transform duration-150 ease-out-custom active:scale-95">
            <div class="relative shrink-0 w-10 h-10 rounded-lg bg-gradient-to-br from-violet-500 to-sky-500 flex items-center justify-center shadow-lg">
              <Artwork seed={1} size={40} />
            </div>
            <div class="flex-1 min-w-0">
              <div class="text-sm font-medium truncate">Welcome to Paradise</div>
              <div class="text-xs text-muted truncate">Aurora Vale</div>
            </div>
          </div>
        </div>
      </section>

      <!-- Playlists -->
      <section>
        <h2 class="font-display text-xl font-bold mb-4">Playlists</h2>
        <div class="space-y-1">
          <div class="flex items-center gap-3 p-2 rounded-lg bg-white/10 hover:bg-white/5 cursor-pointer transition-transform duration-150 ease-out-custom active:scale-95">
            <div class="relative shrink-0 w-10 h-10 rounded-lg bg-gradient-to-br from-violet-500 to-sky-500 flex items-center justify-center shadow-lg overflow-hidden">
              <Artwork seed={p.seed} size={0} className="w-full aspect-square mb-2 rounded-lg" />
            </div>
            <div class="flex-1 min-w-0">
              <div className="text-sm font-medium truncate">{p.name}</div>
              <div className="text-xs text-muted truncate">{p.trackIds.length} tracks</div>
            </div>
          </div>
        </div>
      </section>

      <!-- Saved Albums -->
      <section>
        <h2 class="font-display text-xl font-bold mb-4">Saved Albums</h2>
        <div class="space-y-1">
          <div class="flex items-center gap-3 p-2 rounded-lg bg-white/10 hover:bg-white/5 cursor-pointer transition-transform duration-150 ease-out-custom active:scale-95">
            <div class="relative shrink-0 w-10 h-10 rounded-lg bg-gradient-to-br from-violet-500 to-sky-500 flex items-center justify-center shadow-lg overflow-hidden">
              <Artwork seed={a.seed} size={0} className="w-full aspect-square rounded-lg" />
            </div>
            <div class="flex-1 min-w-0">
              <div class="text-sm font-medium truncate">{a.title}</div>
              <div class="text-xs text-muted truncate">{a.artist}</div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
